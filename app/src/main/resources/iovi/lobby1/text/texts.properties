# Тексты партии: экран, голос ведущего и протокол.
# Файл в UTF-8. {0}, {1}… — подставляемые значения, \n — перенос строки.
# Ключи voice.* звучат голосом, log.* пишутся в протокол партии, остальные показываются на экране.
# Статичные подписи меню, настроек и кнопок разметки — в res/values/strings.xml.

# ─────────────────────────────── Общее ───────────────────────────────

role.CIVILIAN=Мирный житель
role.SHERIFF=Шериф
role.MAFIA=Мафия
role.DON=Дон мафии

player=Игрок {0}
handoff.title={0}\n\nПередайте телефон игроку
button.farewell=Прощальная минута
button.night=Наступает ночь
button.day=Начать день

# «Номер» словом: «№» синтез речи читает ненадёжно.
voice.callPlayer=Игрок номер {0}
voice.thanks=Спасибо.
# {0} — сколько осталось до конца речи или договорки, например «10 секунд»
voice.warning={0}.

# Число со словом: .one — 1, 21, 31…; .few — 2–4, 22–24…; .many — 0, 5–20, 25–30…
votes.one={0} голос
votes.few={0} голоса
votes.many={0} голосов
seconds.one={0} секунду
seconds.few={0} секунды
seconds.many={0} секунд
fouls.one={0} фол
fouls.few={0} фола
fouls.many={0} фолов
# Длительность ровно в минуту — словом, а не «60 секунд»
duration.minute=минута

# Ударения для синтеза речи: stress.<часть слова>=<она же со знаком ́ после ударной гласной>.
# Меняется только произношение, на экране слово остаётся без знака.
stress.договорк=догово́рк
# «номера́» во множественном числе (лучший ход); родительный «но́мера» в голосовых фразах не встречается
stress.номера=номера́

